<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Supplier</title>

  <link rel="stylesheet" href="css/view-supplier.css">
</head>
<body>

<div class="container">

  <div class="sidebar">
    <h2>🛒 Grocery IMS</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="#" onclick="productsPage()">Products</a>
    <a href="supplier-list.html">Suppliers</a>
    <a href="#" onclick="reportsPage()">Reports</a>
    <a href="#" onclick="settingsPage()">Settings</a>
    <a href="#" onclick="logoutPage()">Logout</a>
  </div>

  <div class="main">

    <a href="supplier-list.html" class="back">
      ← Back to Suppliers
    </a>

    <div class="supplier-card">

      <h1>Supplier Details</h1>

      <div class="detail-row">
        <strong>Supplier Name:</strong>
        <span>Dairy Farm</span>
      </div>

      <div class="detail-row">
        <strong>Email:</strong>
        <span>dairy@gmail.com</span>
      </div>

      <div class="detail-row">
        <strong>Phone:</strong>
        <span>9812345678</span>
      </div>

      <div class="detail-row">
        <strong>Address:</strong>
        <span>Budhanilkantha, Kathmandu</span>
      </div>

      <div class="detail-row">
        <strong>Products Supplied:</strong>
        <span>15</span>
      </div>

      <div class="detail-row">
        <strong>Status:</strong>
        <span>Active</span>
      </div>

      <div class="detail-row">
        <strong>Registered Date:</strong>
        <span>12 Jul 2026</span>
      </div>

      <div class="buttons">
        <button onclick="editSupplierPage()">
          Edit Supplier
        </button>

        <button onclick="deleteSupplierPage()">
          Delete Supplier
        </button>
      </div>

    </div>

  </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
