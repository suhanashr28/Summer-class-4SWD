<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Supplier</title>
    <link rel="stylesheet" href="css/edit-supplier.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>🛒 Grocery IMS</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="#" onclick="productsPage()">Products</a>
        <a href="#" onclick="suppliersPage()">Suppliers</a>
        <a href="#" onclick="reportsPage()">Reports</a>
        <a href="#" onclick="settingsPage()">Settings</a>
        <a href="#" onclick="logoutPage()">Logout</a>
      </div>

      <!-- Main Content -->
      <div class="main">
        <a href="supplier-list.html" class="back">← Back to Suppliers</a>

        <div class="form-box">
          <h1>Edit Supplier</h1>

          <form>
            <label>Supplier Name</label>
            <input type="text" id="supplierNameInput" />

            <label>Contact Email</label>
            <input type="email" id="supplierEmailInput" />

            <label>Phone Number</label>
            <input type="text" id="supplierPhoneInput" />

            <label>Address</label>
            <textarea id="supplierAddressInput"></textarea>

            <div class="buttons">
              <button type="button" class="cancel" onclick="suppliersPage()">Cancel</button>
              <button type="button" class="update" onclick="updateSupplier()">Update Supplier</button>
            </div>
          </form>
        </div>
      </div>
    </div>
<script>

const supplierId = localStorage.getItem("supplierId");


// LOAD SUPPLIER
async function loadSupplier(){

    try{

        const response = await fetch(
            `http://localhost:3000/api/suppliers/${supplierId}`
        );

        const supplier = await response.json();

        document.getElementById("supplierNameInput").value =
        supplier.name;

        document.getElementById("supplierEmailInput").value =
        supplier.email;

        document.getElementById("supplierPhoneInput").value =
        supplier.phone;

        document.getElementById("supplierAddressInput").value =
        supplier.address;

    }

    catch(error){

        console.log(error);
        alert("Cannot load supplier");

    }

}


// UPDATE SUPPLIER
async function updateSupplier(){

    const updatedSupplier = {

        name:
        document.getElementById("supplierNameInput").value,

        email:
        document.getElementById("supplierEmailInput").value,

        phone:
        document.getElementById("supplierPhoneInput").value,

        address:
        document.getElementById("supplierAddressInput").value,

        image:"default.jpg"

    };

    try{

        const response = await fetch(
            `http://localhost:3000/api/suppliers/${supplierId}`,
            {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(updatedSupplier)
            }
        );

        const data = await response.json();

        alert(data.message);

        window.location.href =
        "supplier-list.html";

    }

    catch(error){

        console.log(error);
        alert("Update Failed");

    }

}


loadSupplier();

</script>
    
    <script src="js/script.js"></script>
  </body>
</html>
