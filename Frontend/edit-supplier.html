<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Supplier</title>
    <link rel="stylesheet" href="css/edit-supplier.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>🛒 Grocery IMS</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="#" onclick="productsPage()">Products</a>
        <a href="#" onclick="suppliersPage()">Suppliers</a>
        <a href="#" onclick="reportsPage()">Reports</a>
        <a href="#" onclick="settingsPage()">Settings</a>
        <a href="#" onclick="logoutPage()">Logout</a>
      </div>

      <!-- Main Content -->
      <div class="main">
        <a href="supplier-list.html" class="back">← Back to Suppliers</a>

        <div class="form-box">
          <h1>Edit Supplier</h1>

          <form>
            <label>Supplier Name</label>
            <input type="text" id="supplierNameInput" />

            <label>Contact Email</label>
            <input type="email" id="supplierEmailInput" />

            <label>Phone Number</label>
            <input type="text" id="supplierPhoneInput" />

            <label>Address</label>
            <textarea id="supplierAddressInput"></textarea>

            <div class="buttons">
              <button type="button" class="cancel" onclick="suppliersPage()">Cancel</button>
              <button type="button" class="update" onclick="updateSupplier()">Update Supplier</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const suppliers = {
        dairy: {
          name: "Dairy Farm",
          email: "dairy@gmail.com",
          phone: "9812345678",
          address: "Budhanilkantha, Kathmandu"
        },
        fruit: {
          name: "Fresh Fruits Ltd",
          email: "fruits@gmail.com",
          phone: "9800000001",
          address: "Bhaktapur"
        },
        vegetable: {
          name: "Green Vegetables",
          email: "veg@gmail.com",
          phone: "9800000002",
          address: "Lalitpur"
        },
        bakery: {
          name: "Bakery House",
          email: "bakery@gmail.com",
          phone: "9800000003",
          address: "Kathmandu"
        }
      };

      // Get selected supplier from localStorage
      const selectedSupplier = localStorage.getItem("selectedSupplier") || "dairy";
      const s = suppliers[selectedSupplier] || suppliers.dairy;

      // Fill form fields
      document.getElementById("supplierNameInput").value = s.name;
      document.getElementById("supplierEmailInput").value = s.email;
      document.getElementById("supplierPhoneInput").value = s.phone;
      document.getElementById("supplierAddressInput").value = s.address;
    </script>

    <script src="js/script.js"></script>
  </body>
</html>
