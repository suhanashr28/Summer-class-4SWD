<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Supplier</title>
    <link rel="stylesheet" href="css/add-supplier.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>🛒 Grocery IMS</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="#" onclick="productsPage()">Products</a>
        <a href="#" onclick="suppliersPage()">Suppliers</a>
        <a href="#" onclick="reportsPage()">Reports</a>
        <a href="#" onclick="settingsPage()">Settings</a>
        <a href="#" onclick="logoutPage()">Logout</a>
      </div>

      <!-- Main Content -->
      <div class="main">
        <a href="supplier-list.html" class="back">← Back to Suppliers</a>

        <div class="form-box">
          <h1>Add New Supplier</h1>

          <form>
            <label>Supplier Name</label>
            <input type="text" placeholder="Enter supplier name" />

            <label>Contact Email</label>
            <input type="email" placeholder="Enter email" />

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number" />

            <label>Address</label>
            <textarea placeholder="Enter address"></textarea>

            <div class="buttons">
              <button type="reset" class="cancel">Cancel</button>
              <button type="button" class="save" onclick="suppliersPage()">Save Supplier</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
