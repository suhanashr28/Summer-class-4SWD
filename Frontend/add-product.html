<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>
    <link rel="stylesheet" href="css/add-product.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>🛒 Grocery IMS</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="#" onclick="productsPage()">Products</a>
        <a href="#" onclick="suppliersPage()">Suppliers</a>
        <a href="#" onclick="reportsPage()">Reports</a>
        <a href="#" onclick="settingsPage()">Settings</a>
        <a href="#" onclick="logoutPage()">Logout</a>
      </div>

      <!-- Main Content -->
      <div class="main">
        <a href="product.html" class="back">← Back to Products</a>

        <h1>Add New Product</h1>

        <form class="product-form">
          <!-- Left Side -->
          <div class="left">
            <label>Product Name</label>
            <input type="text" placeholder="Enter product name" />

            <label>Description</label>
            <textarea placeholder="Enter product description"></textarea>

            <div class="row">
              <div>
                <label>Price</label>
                <input type="number" placeholder="Enter price" />
              </div>

              <div>
                <label>Quantity</label>
                <input type="number" placeholder="Enter quantity" />
              </div>
            </div>
          </div>

          <!-- Right Side -->
          <div class="right">
            <label>Category</label>
            <select>
              <option>Select Category</option>
              <option>Dairy</option>
              <option>Fruits</option>
              <option>Vegetables</option>
              <option>Bakery</option>
            </select>

            <label>Product Image</label>

            <input type="file" />
          </div>
        </form>

        <div class="buttons">
          <button class="cancel" type="button" onclick="productsPage()">Cancel</button>
          <button class="save" type="button" onclick="productsPage()">Save Product</button>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
