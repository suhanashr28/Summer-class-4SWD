<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Inventory System</title>

    <link rel="stylesheet" href="product.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
     <div class="sidebar">
    <h2>🛒 Grocery IMS</h2>

    <a href="dashboard.html">Dashboard</a>

    <a href="#" onclick="productsPage()">Products</a>

    <a href="supplier-list.html">Suppliers</a>

    <a href="#" onclick="reportsPage()">Reports</a>

    <a href="#" onclick="settingsPage()">Settings</a>

    <a href="#" onclick="logoutPage()">Logout</a>
</div>

      <!-- Main Content -->
      <div class="main">
        <h1>Products</h1>

        <div class="top-bar">
          <input type="text" placeholder="Search Product" />

          <select>
            <option>All Categories</option>
            <option>Dairy</option>
            <option>Fruits</option>
            <option>Vegetables</option>
            <option>Bakery</option>
          </select>

          <button onclick="addProductPage()">Add Product</button>
        </div>

        <div class="table-container">
          <table>
            <tr>
              <th>Image</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Status</th>
              <th>Action</th>
            </tr>

            <tr>
              <td>🥛</td>
              <td>Milk</td>
              <td>Dairy</td>
              <td>Rs.120</td>
              <td>20</td>
              <td class="stock">In Stock</td>
              <td class="actions">
                <i class="fa-solid fa-eye" onclick="viewProductPage()"></i>

                <i class="fa-solid fa-pen" onclick="editProductPage()"></i>
              </td>
            </tr>

            <tr class="low-stock">
              <td>🍞</td>
              <td>Bread</td>
              <td>Bakery</td>
              <td>Rs.60</td>
              <td>3</td>
              <td class="low">Low Stock</td>
              <td class="actions">
                <i class="fa-solid fa-eye" onclick="viewProductPage()"></i>

                <i class="fa-solid fa-pen" onclick="editProductPage()"></i>
              </td>
            </tr>

            <tr>
              <td>🍎</td>
              <td>Apple</td>
              <td>Fruits</td>
              <td>Rs.250</td>
              <td>15</td>
              <td class="stock">In Stock</td>
              <td class="actions">
                <i class="fa-solid fa-eye" onclick="viewProductPage()"></i>
                <i class="fa-solid fa-pen" onclick="editProductPage()"></i>
              </td>
            </tr>

            <tr class="low-stock">
              <td>🥚</td>
              <td>Eggs</td>
              <td>Dairy</td>
              <td>Rs.180</td>
              <td>4</td>
              <td class="low">Low Stock</td>
              <td class="actions">
                <i class="fa-solid fa-eye" onclick="viewProductPage()"></i>

                <i class="fa-solid fa-pen" onclick="editProductPage()"></i>
              </td>
            </tr>
          </table>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
