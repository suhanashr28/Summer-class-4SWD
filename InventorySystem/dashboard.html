<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2>🛒 Grocery IMS</h2>

        <a href="dashboard.html">Dashboard</a>

        <a href="#" onclick="productsPage()">Products</a>

        

        <a href="#" onclick="suppliersPage()">Suppliers</a>

        <a href="#" onclick="reportsPage()">Reports</a>

        <a href="#" onclick="settingsPage()">Settings</a>

        <a href="#" onclick="logoutPage()">Logout</a>
      </div>

      <div class="main">
        <h1>Dashboard</h1>

        <div class="cards">
          <div class="card">
            <h3>Total Products</h3>
            <p>350</p>
          </div>

          <div class="card">
            <h3>Available Stock</h3>
            <p>2450</p>
          </div>

          <div class="card">
            <h3>Low Stock</h3>
            <p>15</p>
          </div>

          <div class="card">
            <h3>Suppliers</h3>
            <p>20</p>
          </div>
          <div class="card">
            <h3>Total Value</h3>
            <p>20000</p>
          </div>
        </div>

        <div class="table-section">
          <h2>Low Stock Products</h2>

          <table>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Quantity</th>
              <th>Status</th>
            </tr>

            <tr>
              <td>Milk</td>
              <td>Dairy</td>
              <td>3</td>
              <td class="low">Low Stock</td>
            </tr>

            <tr>
              <td>Bread</td>
              <td>Bakery</td>
              <td>2</td>
              <td class="low">Low Stock</td>
            </tr>

            <tr>
              <td>Rice</td>
              <td>Grains</td>
              <td>20</td>
              <td>In Stock</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script src="auth.js"></script>

  </body>
</html>
