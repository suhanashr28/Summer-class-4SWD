<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="setting.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
    <h2>🛒 Grocery IMS</h2>

    <a href="dashboard.html">Dashboard</a>

    <a href="#" onclick="productsPage()">Products</a>

    <a href="supplier-list.html">Suppliers</a>

    <div class="main">

        <h1>Settings</h1>

        <div class="card">
            <h2>Store Information</h2>

            <label>Store Name</label>
            <input type="text" placeholder="Grocery IMS">

            <label>Email</label>
            <input type="email" placeholder="admin@gmail.com">

            <label>Phone</label>
            <input type="text" placeholder="9812345678">
        </div>

        <div class="card">
            <h2>Change Password</h2>

            <label>New Password</label>
            <input type="password">

            <label>Confirm Password</label>
            <input type="password">
        </div>

        <button onclick="saveSettings()">Save Changes</button>

    </div>

</div>

<script src="script.js"></script>

</body>
